# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repository. Creates a free Postgres
# and a free web service built from the root Dockerfile.
databases:
  - name: shop-db
    plan: free
    databaseName: shop
    user: shop

services:
  - type: web
    name: shop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shop-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
