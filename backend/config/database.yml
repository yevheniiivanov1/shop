# PostgreSQL.
# Locally the connection comes from DB_HOST / DB_USERNAME / DB_PASSWORD (see
# docker-compose.yml). In production DATABASE_URL points at the managed database
# and Rails merges it on top of the settings below.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: shop_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: shop_test

production:
  <<: *default
  database: shop_production
